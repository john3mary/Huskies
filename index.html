<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Huskies Bowl & Playoff Tracker</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0b0c10;
            color: #f4f5f7;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
        }
        h1 {
            color: #b7a57a;
            font-size: 1.6rem;
            text-align: center;
            margin: 15px 0 5px 0;
        }
        .subtitle {
            text-align: center;
            color: #8da2bb;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }
        .control-panel {
            text-align: center;
            margin-bottom: 20px;
            background-color: #1f2833;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #45a29e;
        }
        .btn {
            background-color: #b7a57a;
            color: #0b0c10;
            padding: 10px 20px;
            border-radius: 4px;
            font-weight: bold;
            border: none;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #9a885c;
        }
        .timestamp {
            font-size: 0.9rem;
            color: #12e193;
            font-weight: bold;
            margin-top: 10px;
        }
        .table-wrapper {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1f2833;
            border-radius: 6px;
            overflow: hidden;
            font-size: 0.9rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #3a506b;
        }
        th {
            background-color: #1f2833;
            color: #b7a57a;
            border-bottom: 2px solid #45a29e;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }
        .good { color: #12e193; font-weight: bold; }
        .bad { color: #e63946; font-weight: bold; }
        .mixed { color: #ffb703; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍇 Huskies Bowl & Playoff Tracker</h1>
        <div class="subtitle">Big Ten Standings Automated Weekly Feed (UW: 4-3, 1-3 Big Ten)</div>
        
        <div class="control-panel">
            <button class="btn" onclick="fetchWeeklyScores()">🔄 Refresh Weekly Matchups</button>
            <div class="timestamp" id="refresh-time">Connecting to live Big Ten data stream...</div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Matchup</th>
                        <th>Significance & Playoff Impact</th>
                        <th>Status / Current Score</th>
                        <th>Indicator</th>
                    </tr>
                </thead>
                <tbody id="matchups-table-body">
                    <tr><td colspan="4" style="text-align:center; color:#8da2bb;">Loading current weekly games schedule...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function fetchWeeklyScores() {
            // Using the precise web data api feed directly to pull structural scoreboard records securely
            fetch('https://site.web.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard')
                .then(res => {
                    if (res.ok) return res.json();
                    throw new Error('Connection timeout.');
                })
                .then(data => {
                    const events = data.events || [];
                    const tableBody = document.getElementById('matchups-table-body');
                    tableBody.innerHTML = ''; 

                    const b10Teams = ["WASH", "NEB", "MINN", "IND", "WIS", "IOWA", "MICH", "RUTG", "NW", "ORE", "OSU", "PSU", "USC", "UCLA", "PUR", "ILL", "MSU", "MD"];

                    const b10Events = events.filter(event => {
                        const competitors = event.competitions.competitors;
                        return competitors.some(c => b10Teams.includes(c.team.abbreviation));
                    });

                    if (b10Events.length === 0) {
                        tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No Big Ten games found in this week\'s schedule.</td></tr>';
                        return;
                    }

                    b10Events.forEach(event => {
                        const shortName = event.shortName;
                        const isCompleted = event.status.type.completed;
                        const state = event.status.type.state;
                        const competitors = event.competitions.competitors;
                        
                        let home = competitors.find(c => c.homeAway === 'home');
                        let away = competitors.find(c => c.homeAway === 'away');
                        
                        let homeScore = parseInt(home.score);
                        let awayScore = parseInt(away.score);
                        
                        let scoreText = `${away.team.abbreviation} ${away.score}, ${home.team.abbreviation} ${home.score} (${event.status.type.shortDetail})`;
                        if (state === 'pre') {
                            scoreText = event.status.type.detail; 
                        }

                        let impactText = "Big Ten conference positioning match.";
                        let indicatorText = "🍇 Track Outcome";
                        let indicatorClass = "mixed";

                        const isUWGame = shortName.includes("WASH");

                        if (isUWGame) {
                            impactText = "Primary Matchup. Critical win vector required to reach the 6-win bowl eligibility baseline.";
                            indicatorText = "🍇 Primary Matchup";
                            indicatorClass = "mixed";
                            if (isCompleted) {
                                const uwWon = (away.team.abbreviation === "WASH" && awayScore > homeScore) || (home.team.abbreviation === "WASH" && homeScore > awayScore);
                                indicatorText = uwWon ? "👍 Good (Huskies Won!)" : "❌ Bad (Huskies Lost)";
                                indicatorClass = uwWon ? "good" : "bad";
                            }
                        } else {
                            impactText = `Middle-tier conference leverage tracking. Pinning rival losses supports Washington's standings ladder.`;
                        }

                        const row = `<tr>
                            <td style="font-weight:bold;">${shortName}</td>
                            <td>${impactText}</td>
                            <td>${scoreText}</td>
                            <td class="${indicatorClass}">${indicatorText}</td>
                        </tr>`;
                        
                        if (isUWGame) {
                            tableBody.insertAdjacentHTML('afterbegin', row);
                        } else {
                            tableBody.insertAdjacentHTML('beforeend', row);
                        }
                    });

                    const now = new Date();
                    document.getElementById('refresh-time').innerText = "Last Refreshed: " + now.toLocaleTimeString();
                })
                .catch(err => {
                    const now = new Date();
                    document.getElementById('refresh-time').innerText = "Last Refreshed: " + now.toLocaleTimeString() + " (Sync delay - tap button to retry)";
                });
        }
        window.onload = fetchWeeklyScores;
    </script>
</body>
</html>

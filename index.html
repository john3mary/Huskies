<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UW Huskies Playoff & Bowl Tracker</title>
    <style>
        :root {
            --uw-purple: #4b2e83;
            --uw-gold: #b7a57a;
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --text-light: #f5f5f7;
            --text-muted: #a1a1a6;
            --win-green: #34c759;
            --lose-red: #ff3b30;
            --alert-orange: #ff9500;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding: 20px 15px 40px 15px;
        }

        .dashboard-container {
            max-width: 500px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--uw-purple);
            padding-bottom: 15px;
        }

        header h1 {
            font-size: 1.6rem;
            color: var(--text-light);
            font-weight: 800;
        }

        header p {
            color: var(--uw-gold);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        .summary-box {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #2c2c2e;
        }

        .summary-box h3 {
            font-size: 0.9rem;
            text-transform: uppercase;
            color: var(--uw-gold);
            margin-bottom: 12px;
            letter-spacing: 0.5px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .summary-row:last-child {
            margin-bottom: 0;
        }

        .indicator-label {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .status-dot.green { background-color: var(--win-green); }
        .status-dot.red { background-color: var(--lose-red); }
        .status-dot.yellow { background-color: #ffcc00; }

        .stat-val {
            font-weight: 700;
        }

        .refresh-btn {
            width: 100%;
            background-color: var(--uw-purple);
            color: white;
            border: 1px solid var(--uw-gold);
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            margin-bottom: 25px;
            text-transform: uppercase;
            transition: background 0.2s;
        }

        .refresh-btn:active {
            background-color: #372161;
        }

        .section-header {
            font-size: 1.1rem;
            color: var(--text-light);
            margin-bottom: 12px;
            font-weight: 700;
            border-left: 4px solid var(--uw-gold);
            padding-left: 8px;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1px solid #2c2c2e;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .team-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .team-row:last-of-type {
            margin-bottom: 14px;
        }

        .team-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .team-name {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .bowl-badge {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            background-color: #2c2c2e;
            color: var(--text-muted);
            font-weight: 600;
        }
        
        .bowl-badge.eligible {
            background-color: rgba(52, 199, 89, 0.15);
            color: var(--win-green);
        }

        .danger-badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            background-color: rgba(255, 149, 0, 0.15);
            color: var(--alert-orange);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .team-score {
            font-size: 1.25rem;
            font-weight: 800;
        }

        .impact-statement {
            font-size: 0.85rem;
            line-height: 1.4;
            padding: 10px;
            border-radius: 6px;
            background-color: #151516;
            border-left: 4px solid #444;
        }

        .impact-statement.good { border-left-color: var(--win-green); }
        .impact-statement.bad { border-left-color: var(--lose-red); }
        .impact-statement.neutral { border-left-color: #ffcc00; }

        #loading-notice {
            text-align: center;
            color: var(--text-muted);
            padding: 30px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <header>
            <h1>Huskies Playoff Tracker</h1>
            <p id="week-display">Big Ten Leverage Feed</p>
        </header>

        <div class="summary-box">
            <h3>Today's Playoff Tracking Summary:</h3>
            <div class="summary-row">
                <div class="indicator-label"><span class="status-dot yellow"></span>UW Huskies Outcome:</div>
                <div id="summary-huskies" class="stat-val">--</div>
            </div>
            <div class="summary-row">
                <div class="indicator-label"><span class="status-dot green"></span>Conference Rivals Knocked Down:</div>
                <div id="summary-good" class="stat-val">0</div>
            </div>
            <div class="summary-row">
                <div class="indicator-label"><span class="status-dot red"></span>Rivals Holding Ground:</div>
                <div id="summary-bad" class="stat-val">0</div>
            </div>
        </div>

        <button class="refresh-btn" onclick="loadHuskiesData()">Refresh Scores</button>

        <div class="section-header">Current Weekly Games Schedule</div>
        <div id="loading-notice">Fetching live game configurations from ESPN...</div>
        <div id="games-container"></div>
    </div>

    <script>
        // Full list of 18 Big Ten teams to identify conference matchups dynamically
        const bigTenTeams = [
            "WASH", "ORE", "USC", "UCLA", "OSU", "MICH", "PSU", "IND", 
            "IOWA", "WIS", "MINN", "NEB", "ILL", "NW", "MSU", "PUR", "RUTG", "MD"
        ];

        // Teams that played the Huskies this year (Direct Tiebreakers)
        const pastOpponents = ["MINN", "USC", "IOWA", "PUR", "NEB", "NW", "MICH", "IND", "UCLA", "ORE", "PSU"];

        // Top Tier elite teams that are out of reach for a head-to-head middle tier tiebreaker catch
        const eliteTier = ["ORE", "IND", "OSU", "PSU"];

        async function loadHuskiesData() {
            const btn = document.querySelector('.refresh-btn');
            const loader = document.getElementById('loading-notice');
            if (btn) btn.innerText = "Refreshing...";
            if (loader) loader.style.display = 'block';

            try {
                const response = await fetch('https://site.api.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80');
                const data = await response.json();
                
                // Set the current week dynamically from the ESPN feed context calendar
                if (data.leagues && data.leagues[0] && data.leagues[0].calendar) {
                    const activeWeek = data.leagues[0].calendar.find(c => c.active);
                    if (activeWeek) {
                        document.getElementById('week-display').innerText = `Live ${activeWeek.label} Leverage Feed`;
                    }
                }

                const events = data.events || [];
                const container = document.getElementById('games-container');
                container.innerHTML = '';
                loader.style.display = 'none';

                let goodOutcomes = 0;
                let badOutcomes = 0;
                let huskiesStatus = "Scheduled";

                events.forEach(event => {
                    const match = event.competitions[0];
                    const home = match.competitors.find(c => c.homeAway === 'home');
                    const away = match.competitors.find(c => c.homeAway === 'away');

                    const hAbbr = home.team.abbreviation;
                    const aAbbr = away.team.abbreviation;

                    // Ensure it is a Big Ten conference match (either team belongs to the B1G)
                    const isBigTenMatch = bigTenTeams.includes(hAbbr) || bigTenTeams.includes(aAbbr);

                    if (isBigTenMatch) {
                        const isFinished = event.status.type.completed;
                        const state = event.status.type.state;
                        
                        // Extract wins from record arrays for bowl verification
                        const homeWins = (home.records && home.records[0]) ? parseInt(home.records[0].summary.split('-')[0]) : 0;
                        const awayWins = (away.records && away.records[0]) ? parseInt(away.records[0].summary.split('-')[0]) : 0;

                        // Figure out strategic rooting guide adjustments matching middle-tier logjam
                        let preferredWinner = null;
                        let strategicDesc = "";

                        if (hAbbr === "WASH" || aAbbr === "WASH") {
                            preferredWinner = "WASH";
                            strategicDesc = "The vital piece. A win directly elevates conference standing math.";
                        } else {
                            // If a direct middle pack competitor faces an out-of-reach elite squad, root for elite squad to deliver a loss
                            const isHomeElite = eliteTier.includes(hAbbr);
                            const isAwayElite = eliteTier.includes(aAbbr);

                            if (isHomeElite && !isAwayElite) {
                                preferredWinner = hAbbr;
                                strategicDesc = `Root for ${hAbbr}. A ${aAbbr} loss pushes a direct middle-pack competitor down.`;
                            } else if (isAwayElite && !isHomeElite) {
                                preferredWinner = aAbbr;
                                strategicDesc = `Root for ${aAbbr}. A ${hAbbr} loss pushes a direct middle-pack competitor down.`;
                            } else {
                                // Default back to rooting against whoever has the higher conference stance
                                preferredWinner = homeWins > awayWins ? aAbbr : hAbbr;
                                strategicDesc = `Root for ${preferredWinner} to maximize logjam parity in the middle standings.`;
                            }
                        }

                        let impactClass = "neutral";
                        let impactText = strategicDesc;

                        if (isFinished) {
                            const winnerAbbr = home.winner ? hAbbr : aAbbr;
                            if (hAbbr === "WASH" || aAbbr === "WASH") {
                                huskiesStatus = (winnerAbbr === "WASH") ? "🟢 WON" : "🔴 LOST";
                            } else {
                                if (winnerAbbr === preferredWinner) {
                                    goodOutcomes++;
                                    impactClass = "good";
                                    impactText = `👉 Result is Good! Loss delivered to middle-tier threat.`;
                                } else {
                                    badOutcomes++;
                                    impactClass = "bad";
                                    impactText = `⚠️ Result is Bad. Bubble competitor secured standings separation ground.`;
                                }
                            }
                        } else if (state === "in") {
                            impactClass = "neutral";
                            impactText = `⚡ Live tracking: Prefer ${preferredWinner} victory outcomes.`;
                            if (hAbbr === "WASH" || aAbbr === "WASH") huskiesStatus = "🔥 LIVE";
                        }

                        // Generate tiebreaker alerts if opponents have gone head-to-head with UW
                        const homeTiebreakerBadge = pastOpponents.includes(hAbbr) && hAbbr !== "WASH" ? `<span class="danger-badge">Tiebreaker Danger</span>` : "";
                        const awayTiebreakerBadge = pastOpponents.includes(aAbbr) && aAbbr !== "WASH" ? `<span class="danger-badge">Tiebreaker Danger</span>` : "";

                        const card = document.createElement('div');
                        card.className = 'game-card';
                        card.innerHTML = `
                            <div class="game-header">
                                <span>${event.status.type.detail}</span>
                                <span>${match.broadcasts && match.broadcasts[0] ? match.broadcasts[0].media.shortName : 'TV'}</span>
                            </div>
                            <div class="team-row">
                                <div class="team-info">
                                    <span class="team-name">${away.team.displayName}</span>
                                    <span class="bowl-badge ${awayWins >= 6 ? 'eligible' : ''}">${awayWins}/6 Wins</span>
                                    ${awayTiebreakerBadge}
                                </div>
                                <span class="team-score">${away.score || 0}</span>
                            </div>
                            <div class="team-row">
                                <div class="team-info">
                                    <span class="team-name">${home.team.displayName}</span>
                                    <span class="bowl-badge ${homeWins >= 6 ? 'eligible' : ''}">${homeWins}/6 Wins</span>
                                    ${homeTiebreakerBadge}
                                </div>
                                <span class="team-score">${home.score || 0}</span>
                            </div>
                            <div class="impact-statement ${impactClass}">
                                ${impactText}
                            </div>
                        `;
                        container.appendChild(card);
                    }
                });

                document.getElementById('summary-huskies').innerText = huskiesStatus;
                document.getElementById('summary-good').innerText = goodOutcomes;
                document.getElementById('summary-bad').innerText = badOutcomes;

            } catch (error) {
                console.error("Endpoint data parse error:", error);
                if (loader) loader.innerText = "Error syncing with live college football streams.";
            } finally {
                if (btn) btn.innerText = "Refresh Scores";
            }
        }

        loadHuskiesData();
    </script>
</body>
</html>
